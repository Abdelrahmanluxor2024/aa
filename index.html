<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #1e3c72;
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    .video-wrapper {
      border-radius: 10px;
      overflow: hidden;
    }
    
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f5f7fa;
      border-radius: 8px;
      color: #555;
      text-align: center;
      font-size: 14px;
    }
    
    /* ????? ??? ?????? */
    :root {
      --plyr-color-main: #2a5298;
    }
  </style>
</head>
<body>

  <script>

        'play',
        'progress',
        'current-time',

        'captions',
        'settings',
        'pip',
        'fullscreen'
