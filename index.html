<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???? ??????? ???? ??????</title>
  
  <!-- ??? ????? Plyr -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #1e3c72;
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    /* ??????? ???????? ?? ?? ?????? ??????? */
    .video-wrapper {
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #000;
    }

    /* ?? ???? ?? ???? ?????? ??????? ???????? */
    .plyr__video-embed iframe {
      transform: scale(1.35) !important; /* ????? ??????? ?????? ???? ?????? */
      top: -10% !important; /* ????? ???????? ??????? ????? ?????? */
    }

    /* ????? ??? Plyr */
    :root {
      --plyr-color-main: #1e3c72;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>?? ???? ??????? ????</h1>
    
    <div class="video-wrapper">
      <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="vQggZQcdWYE"></div>
    </div>
  </div>

  <!-- ????? Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const player = new Plyr('#player', {
      controls: [
        'play-large',
        'play',
        'progress',
        'current-time',
        'duration',
        'mute',
        'volume',
        'settings',
        'fullscreen'
      ],
      settings: ['speed'],
      youtube: {
        noCookie: true,
        rel: 0,
        showinfo: 0,
        iv_load_policy: 3,
        modestbranding: 1
      },
      ratio: '16:9'
    });
  </script>

</body>
</html>
