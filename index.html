<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض فيديو احترافي</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    /* الحاوية الخارجية (الكارت الأبيض) */
    .video-card {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    
    /* حاوية الفيديو لضبط الأبعاد والحواف الدائرية */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* نسبة 16:9 */
      height: 0;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }
    
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    /* العنوان والبيانات أسفل الفيديو (مثل صورتك) */
    .video-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding: 5px 10px;
    }
    
    .video-title {
      font-size: 22px;
      font-weight: bold;
      color: #1a0dab; /* لون أزرق احترافي */
    }
    
    .share-icon {
      color: #5f6368;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    
    .share-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="video-card">
    
    <!-- منطقة الفيديو -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/LMvscpZfaYs?rel=0&modestbranding=1&iv_load_policy=3" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>
    
    <!-- منطقة العنوان والمشاركة -->
    <div class="video-footer">
      <h2 class="video-title">عنوان الفيديو هنا</h2>
      
      <div class="share-icon" title="مشاركة">
        <svg viewBox="0 0 24 24">
          <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
        </svg>
      </div>
    </div>

  </div>

</body>
</html>
