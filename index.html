<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>???? ????? ???????</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: system-ui, sans-serif;
    }
    
    .video-card {
      width: 100%;
      max-width: 850px;
      background: #1e293b;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    
    /* ????? ??????? ?????? ????? ???? ?? */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* ???? 16:9 ??????? */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    /* ?????? ?????? ??? ??????? */
    .video-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s;
    }
    
    .play-btn {
      width: 70px;
      height: 70px;
      background: rgba(37, 99, 235, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 30px rgba(37, 99, 235, 0.6);
      transition: transform 0.2s;
    }
    
    .video-cover:hover .play-btn {
      transform: scale(1.1);
      background: #2563eb;
    }
    
    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: #fff;
      margin-left: 3px;
    }
  </style>
</head>
<body>

  <div class="video-card">
    <div class="video-container" id="videoContainer">
      
      <!-- ?????? ?????? (???? ??????? ?? ?? ???????) -->
      <div class="video-cover" id="videoCover" style="background-image: url('https://img.youtube.com/vi/vQggZQcdWYE/maxresdefault.jpg');" onclick="playVideo()">
        <div class="play-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    function playVideo() {
      var container = document.getElementById('videoContainer');
      // ??? ????? ??? ????? ?????? ??????? ?????
      container.innerHTML = `<iframe src="https://www.youtube.com/embed/vQggZQcdWYE?autoplay=1&rel=0&modestbranding=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    }
  </script>

</body>
</html>
