<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض فيديو احترافي</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #f0f2f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    /* الحاوية الخارجية (الكارت الأبيض) */
    .video-card {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    
    /* حاوية الفيديو لضبط الأبعاد والحواف الدائرية */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* نسبة 16:9 */
      height: 0;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }
    
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    
    /* العنوان والبيانات أسفل الفيديو (مثل صورتك) */
    .video-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding: 5px 10px;
    }
    
    .video-title {
      font-size: 22px;
      font-weight: bold;
      color: #1a0dab; /* لون أزرق احترافي */
    }
    
    .share-icon {
      color: #5f6368;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    
    .share-icon svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="video-card">
    
    <!-- منطقة الفيديو -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/LMvscpZfaYs?rel=0&modestbranding=1&iv_load_policy=3" 
        title="YouTube video player" 
        allow="accelerometer;
